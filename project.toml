schema_version = 1
template_version = "1.20.1-template-1.0.0"

[mod]
mod_id = "pidatagraph"
mod_name = "PiDataGraph"
version = "0.0.5"
version_suffix = "dev"
group = "com.mihono.pickaid"
authors = ["PickAID Team"]
license = "MIT"
description = "Expression and codec-backed data tools for gameplay definitions."
credits = "None"
issue_tracker_url = "https://github.com/PickAID/PiDataGraph/issues"

[features]
# Built-in ecosystem switches handled directly by the template build.
jei = false
curios = false
geckolib = false
player_animator = false
mixin_extras = false

[dev_packs]
# Local-only helper packs for development runs.
# They are for easier local testing and do not define your published API surface.
basic = false
appleskin = false
combat = false
curios = false
spell = false
kubejs = false

[overrides]
# Optional version overrides for enabled features only.

[repositories]
central = "https://repo.maven.apache.org/maven2"
mihono = "https://maven.mihono.cn/repository/pickaid1201/"

[dependencies]
[dependencies.implementation]
exp4j = { notation = "net.objecthunter:exp4j:0.4.8", transitive = false }
piserializekit = { notation = "com.mihono.pickaid:piserializekit:0.0.7", transitive = false }
pinet = { notation = "com.mihono.pickaid:pinet:0.0.5", transitive = false }

[dependencies.jarjar]
exp4j = { notation = "net.objecthunter:exp4j:0.4.8", range = "[0.4.8,0.5)", transitive = false }
piserializekit = { notation = "com.mihono.pickaid:piserializekit:0.0.7", range = "[0.0.7,0.1.0)", transitive = false }
pinet = { notation = "com.mihono.pickaid:pinet:0.0.5", range = "[0.0.5,0.1.0)", transitive = false }

[dependencies.annotation_processor]
piserializekit_processor = { notation = "com.mihono.pickaid:piserializekit:0.0.7", transitive = false }

[publish]
# Leave tokens out of git. Prefer environment variables for real releases.
maven_url = "https://maven.mihono.cn/repository/pickaid1201/"
curseforge_project = 0
modrinth_project = ""
release_type = "alpha"

[publish.mods]
# Shared defaults for Modrinth and CurseForge uploads.
# Supported tokens: {mod_id}, {mod_name}, {version}, {mc_version}, {loader}, {archive_name}
release_type = "alpha"
version_name = "[{mc_version}] {mod_name} {version}"
display_name = "[{mc_version}] {mod_name} - {version}"
changelog = ""
changelog_file = "CHANGELOG.md"
# version extracts only the current mod.version section; full uploads the whole file.
changelog_section = "version"
changelog_type = "markdown"
game_versions = ["1.20.1"]
loaders = ["forge"]

[publish.modrinth]
# Project slug or id. Leave blank to skip Modrinth.
project = ""
# token = ""
# version_name = "[{mc_version}] {mod_name} {version}"
# changelog = ""
# changelog_file = "CHANGELOG.md"
# changelog_section = "version"
# game_versions = ["1.20.1"]
# loaders = ["forge"]
# sync_body_file = "README.MD"
# debug = false

[publish.curseforge]
# Numeric project id. Leave 0 to skip CurseForge.
project = 0
# token = ""
# display_name = "[{mc_version}] {mod_name} - {version}"
# changelog = ""
# changelog_file = "CHANGELOG.md"
# changelog_section = "version"
# changelog_type = "markdown"
# game_versions = ["1.20.1", "Forge"]
# manual_release = false
# parent_file_id = 0

[naming]
# Published jar naming.
archive_name = "pidatagraph"
jar_format = "{archive_name}-{mc_version}-{version}"
